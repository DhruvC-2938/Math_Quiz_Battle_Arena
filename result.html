<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/result.css">
</head>

<body>

    <nav class="navbar">
        <video autoplay muted loop class="navbar_video">
            <source src="assets/Video.mp4" type="video/mp4">
        </video>

        <div class="nav_container">
            <div class="logo">
                <img src="assets/logo.png" alt="Math Quiz Arena Logo">
            </div>

            <ul class="nav_links">
                <li><a href="index.html">Home</a></li>
                <li><a href="levels.html">Play</a></li>
                <li><a href="leaderboard.html">Leaderboard</a></li>
                <li><a href="forum.html">Forum</a></li>
            </ul>
                        <div class="user_area" id="userArea">
                <div class="avatar">👤</div>
                <span id="navUser">Sign In</span>
            </div>
        </div>
    </nav>
    <main class="main">

    <section class="section">

        <h1 class="title">Quiz Completed</h1>

        <div class="card">

            <h2 id="name"></h2>

            <p class="score">
                Score: <span id="final_score"></span> / 10
            </p>

            <p id="result"></p>

            <div class="buttons">

                <a href="levels.html">
                    <button class="btn1">Play Again</button>
                </a>

                <a href="leaderboard.html">
                    <button class="btn2">View Leaderboard</button>
                </a>

            </div>

        </div>

    </section>
    </main>

    <footer class="footer">
        <h3>Math Quiz Battle Arena</h3>

        <div class="footer_links">
            <a href="index.html">Home</a>
            <span>|</span>

            <span>|</span>
            <a href="leaderboard.html">Leaderboard</a>
            <span>|</span>
            <a href="forum.html">Forum</a>
        </div>

        <p>© 2025 Math Quiz Battle Arena</p>
    </footer>

    <script src="JS/main.js"></script>
    <script src="JS/result.js"></script>

</html>
