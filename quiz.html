    <link rel="stylesheet" href="CSS/style.css">

<body>
    <nav class="navbar">
        <video autoplay muted loop class="navbar_video">
            <source src="assets/Video.mp4" type="video/mp4">

        <div class="nav_container">
            <div class="logo">
                <img src="assets/slogo.png" alt="Math Quiz Arena Logo">

    <main class="main">
    <h1 class="title">Math Challenge</h1>

            <span id="timer">Time: 10</span>
        </div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <p id="question">
            What is 8 × 7 ?
        </p>
        <div class="options">
            <button class="option" id="option1">54</button>
            <button class="option" id="option2">56</button>
            <button class="option" id="option3">64</button>
            <button class="option" id="option4">49</button>
